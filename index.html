<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>KasirKu Pro - POS & Inventory</title>

  <!-- PWA Meta Tags -->
  <link rel="manifest" href="manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="KasirKu Pro">
  <meta name="theme-color" content="#064e3b">

  <!-- Tailwind, FontAwesome & Barcode Scanner HTML5 -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  
  <style>
    @media print {
      body * { visibility: hidden !important; }
      #printable-receipt, #printable-receipt * { visibility: visible !important; }
      #printable-receipt {
        position: absolute;
        left: 0;
        top: 0;
        width: 100% !important;
        max-width: 80mm !important;
        padding: 4px !important;
        margin: 0 !important;
        font-size: 11px !important;
        color: #000 !important;
      }
      .no-print { display: none !important; }
    }
    .custom-scrollbar::-webkit-scrollbar { width: 4px; height: 4px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 h-screen flex flex-col font-sans select-none overflow-hidden">

  <!-- TOP BAR -->
  <header class="bg-emerald-800 text-white shadow-md z-20 flex-shrink-0">
    <div class="px-4 py-2.5 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-lg bg-white overflow-hidden shadow flex items-center justify-center border border-emerald-600">
          <img id="topbar-logo" src="icon-192.png" alt="Logo" class="w-full h-full object-cover">
        </div>
        <div>
          <h1 id="topbar-store-name" class="font-bold text-base sm:text-lg leading-tight tracking-wide">KasirKu Pro</h1>
          <p id="topbar-subtext" class="text-[11px] text-emerald-200 line-clamp-1">Point of Sale System</p>
        </div>
      </div>

      <div class="flex items-center space-x-2.5">
        <div class="hidden sm:flex flex-col text-right">
          <span id="digital-clock" class="text-xs font-mono font-semibold tracking-wider text-emerald-100">00:00:00</span>
          <div class="text-xs flex items-center space-x-1 justify-end">
            <span class="inline-block w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
            <span id="label-cashier-name" class="font-bold">Kasir</span>
          </div>
        </div>

        <button type="button" onclick="openShiftModal()" title="Kelola Shift" class="bg-emerald-700 hover:bg-emerald-600 px-2.5 py-1.5 rounded-lg text-xs font-medium transition flex items-center space-x-1 border border-emerald-600">
          <i class="fa-solid fa-clock-rotate-left"></i>
          <span class="hidden md:inline">Shift</span>
        </button>

        <button type="button" onclick="requestAdminAccess()" class="bg-amber-500 hover:bg-amber-400 text-slate-900 px-3 py-1.5 rounded-lg text-xs font-bold transition shadow flex items-center space-x-1.5">
          <i class="fa-solid fa-lock"></i>
          <span>Pemilik</span>
        </button>
      </div>
    </div>
  </header>

  <!-- MAIN WRAPPER -->
  <main class="flex-1 flex overflow-hidden">
    <!-- PANEL KATALOG -->
    <section class="w-full lg:w-8/12 flex flex-col border-r border-slate-200 bg-slate-50">
      <div class="p-3 bg-white border-b border-slate-200 flex-shrink-0 space-y-2.5">
        <div class="flex items-center space-x-2">
          <div class="relative flex-1">
            <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-slate-400 text-xs"></i>
            <input type="text" id="search-input" oninput="renderProductGrid()" placeholder="Cari nama barang atau barcode..." class="w-full pl-8 pr-10 py-1.5 border border-slate-300 rounded-lg text-xs focus:ring-2 focus:ring-emerald-500 focus:outline-none transition">
            <!-- Tombol Scan Barcode Kamera Kasir -->
            <button type="button" onclick="toggleBarcodeScannerModal()" title="Scan Barcode via Kamera HP" class="absolute right-2.5 top-1.5 text-emerald-700 hover:text-emerald-900 px-1">
              <i class="fa-solid fa-barcode text-base"></i>
            </button>
          </div>
          <button type="button" onclick="clearSearch()" class="px-2.5 py-1.5 text-xs bg-slate-100 hover:bg-slate-200 rounded-lg text-slate-600">
            Reset
          </button>
        </div>
        <div id="category-pills" class="flex items-center space-x-2 overflow-x-auto pb-1 custom-scrollbar text-xs font-medium"></div>
      </div>

      <div class="flex-1 p-3 overflow-y-auto custom-scrollbar pb-24 lg:pb-3">
        <div id="product-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3"></div>
        <div id="empty-product-state" class="hidden text-center py-16 text-slate-400">
          <i class="fa-solid fa-box-open text-4xl mb-2"></i>
          <p class="text-xs">Barang tidak ditemukan.</p>
        </div>
      </div>
    </section>

    <!-- PANEL KERANJANG DESKTOP -->
    <section class="hidden lg:flex lg:w-4/12 flex-col bg-white shadow-xl z-10">
      <div class="p-3 border-b border-slate-200 flex justify-between items-center bg-slate-50">
        <div class="flex items-center space-x-2">
          <i class="fa-solid fa-cart-shopping text-emerald-700"></i>
          <h2 class="font-bold text-xs text-slate-800">Keranjang Belanja</h2>
          <span id="cart-item-count" class="bg-emerald-100 text-emerald-800 text-[10px] px-2 py-0.5 rounded-full font-bold">0</span>
        </div>
        <button type="button" onclick="clearCart()" class="text-xs text-rose-600 hover:text-rose-700 font-medium">
          <i class="fa-regular fa-trash-can mr-1"></i>Kosongkan
        </button>
      </div>

      <div id="cart-items-container" class="flex-1 overflow-y-auto p-3 space-y-2 custom-scrollbar"></div>

      <div class="p-3 bg-slate-50 border-t border-slate-200 flex-shrink-0 space-y-2.5">
        <div class="space-y-1 text-xs text-slate-600">
          <div class="flex justify-between">
            <span>Subtotal</span>
            <span id="lbl-subtotal" class="font-semibold text-slate-800">Rp 0</span>
          </div>
          <div class="flex justify-between items-center">
            <span>Diskon <button type="button" onclick="openDiscountPrompt()" class="ml-1 text-emerald-700 hover:underline"><i class="fa-solid fa-pen-to-square"></i></button></span>
            <span id="lbl-discount" class="font-semibold text-rose-600">- Rp 0</span>
          </div>
          <div class="flex justify-between text-sm font-bold text-slate-900 pt-1 border-t border-slate-200">
            <span>Total Akhir</span>
            <span id="lbl-grand-total" class="text-emerald-700 text-base">Rp 0</span>
          </div>
        </div>

        <button type="button" id="btn-proceed-pay" onclick="openCheckoutModal()" disabled class="w-full bg-emerald-600 hover:bg-emerald-700 disabled:bg-slate-300 text-white font-bold py-2.5 rounded-xl shadow transition text-xs flex items-center justify-center space-x-1.5">
          <i class="fa-solid fa-wallet"></i>
          <span>Bayar Sekarang</span>
        </button>
      </div>
    </section>
  </main>

  <!-- FLOATING BOTTOM BAR HP -->
  <div id="mobile-cart-bar" onclick="toggleMobileCartDrawer()" class="lg:hidden fixed bottom-3 left-3 right-3 bg-emerald-800 text-white rounded-2xl shadow-2xl p-3 flex items-center justify-between z-30 cursor-pointer border border-emerald-600 transition-transform duration-300 translate-y-28">
    <div class="flex items-center space-x-3">
      <div class="relative">
        <div class="w-10 h-10 rounded-xl bg-emerald-700 flex items-center justify-center text-lg">
          <i class="fa-solid fa-basket-shopping text-emerald-200"></i>
        </div>
        <span id="mobile-cart-badge" class="absolute -top-1 -right-1 bg-amber-400 text-slate-900 font-extrabold text-[10px] px-1.5 py-0.2 rounded-full">0</span>
      </div>
      <div>
        <p class="text-[10px] text-emerald-200">Total Tagihan</p>
        <p id="mobile-cart-total" class="font-extrabold text-sm">Rp 0</p>
      </div>
    </div>
    <div class="flex items-center space-x-1 bg-emerald-600 px-3 py-1.5 rounded-xl font-bold text-xs">
      <span>Keranjang</span>
      <i class="fa-solid fa-chevron-up text-[10px]"></i>
    </div>
  </div>

  <!-- BOTTOM DRAWER HP -->
  <div id="mobile-cart-drawer" class="lg:hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-40 flex flex-col justify-end hidden">
    <div class="bg-white rounded-t-3xl max-h-[85vh] flex flex-col shadow-2xl overflow-hidden">
      <div class="p-3.5 bg-slate-50 border-b border-slate-200 flex items-center justify-between">
        <h3 class="font-bold text-xs text-slate-800 flex items-center"><i class="fa-solid fa-cart-shopping mr-1.5 text-emerald-700"></i>Rincian Keranjang</h3>
        <div class="flex items-center space-x-3">
          <button type="button" onclick="clearCart()" class="text-xs text-rose-600 font-semibold"><i class="fa-regular fa-trash-can mr-1"></i>Hapus</button>
          <button type="button" onclick="toggleMobileCartDrawer()" class="w-7 h-7 rounded-full bg-slate-200 text-slate-600 flex items-center justify-center"><i class="fa-solid fa-xmark text-xs"></i></button>
        </div>
      </div>
      <div id="mobile-cart-items-container" class="p-3 space-y-2 overflow-y-auto max-h-[48vh] custom-scrollbar"></div>
      <div class="p-3 bg-slate-50 border-t border-slate-200 space-y-2">
        <div class="flex justify-between items-center text-xs">
          <span class="text-slate-500">Diskon</span>
          <button type="button" onclick="openDiscountPrompt()" class="text-emerald-700 font-bold underline flex items-center">
            <span id="mobile-lbl-discount">- Rp 0</span>
            <i class="fa-solid fa-pen-to-square ml-1 text-[10px]"></i>
          </button>
        </div>
        <div class="flex justify-between items-center text-xs font-bold border-t border-slate-200 pt-1.5">
          <span>Total:</span>
          <span id="mobile-lbl-grand-total" class="text-emerald-700 text-base">Rp 0</span>
        </div>
        <button type="button" onclick="toggleMobileCartDrawer(); openCheckoutModal();" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 rounded-xl shadow text-xs flex items-center justify-center space-x-1.5">
          <i class="fa-solid fa-wallet"></i>
          <span>Lanjut ke Pembayaran</span>
        </button>
      </div>
    </div>
  </div>

  <!-- CHECKOUT MODAL -->
  <div id="checkout-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
    <div class="bg-white rounded-2xl shadow-2xl max-w-sm w-full overflow-hidden flex flex-col">
      <div class="px-4 py-3 bg-emerald-800 text-white flex justify-between items-center">
        <h3 class="font-bold text-xs flex items-center space-x-1.5"><i class="fa-solid fa-credit-card"></i><span>Metode Pembayaran</span></h3>
        <button type="button" onclick="closeCheckoutModal()" class="text-emerald-200 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
      </div>

      <div class="p-4 space-y-3">
        <div class="bg-emerald-50 border border-emerald-200 rounded-xl p-2.5 text-center">
          <p class="text-[10px] text-emerald-700 font-semibold uppercase">Total Tagihan</p>
          <p id="checkout-grand-total" class="text-xl font-extrabold text-emerald-800">Rp 0</p>
        </div>

        <div class="grid grid-cols-4 gap-1.5">
          <button type="button" onclick="setPaymentMethod('Cash')" id="btn-method-cash" class="py-1.5 px-1 text-[11px] font-bold rounded-lg border-2 border-emerald-600 bg-emerald-50 text-emerald-800 text-center"><i class="fa-solid fa-money-bill-wave block text-sm mb-0.5"></i>Tunai</button>
          <button type="button" onclick="setPaymentMethod('QRIS')" id="btn-method-qris" class="py-1.5 px-1 text-[11px] font-bold rounded-lg border-2 border-slate-200 text-slate-700 text-center"><i class="fa-solid fa-qrcode block text-sm mb-0.5"></i>QRIS</button>
          <button type="button" onclick="setPaymentMethod('Debit')" id="btn-method-debit" class="py-1.5 px-1 text-[11px] font-bold rounded-lg border-2 border-slate-200 text-slate-700 text-center"><i class="fa-regular fa-credit-card block text-sm mb-0.5"></i>Debit</button>
          <button type="button" onclick="setPaymentMethod('Transfer')" id="btn-method-transfer" class="py-1.5 px-1 text-[11px] font-bold rounded-lg border-2 border-slate-200 text-slate-700 text-center"><i class="fa-solid fa-building-columns block text-sm mb-0.5"></i>Transfer</button>
        </div>

        <div id="section-cash" class="space-y-2 text-xs">
          <div>
            <label class="block font-medium text-slate-700 mb-0.5">Uang Diterima (Rp)</
